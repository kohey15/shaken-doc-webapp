<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1e5ab4" />
<link rel="manifest" href="./manifest.json" />
<title>車検書類作成システム - 設定</title>
<style>
  :root { --primary: #1e5ab4; --primary-dark: #163f80; --bg: #f2f5fa; --card: #fff; --border: #d8e0ee; --text: #222; --text-muted: #666; }
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Sans", "Yu Gothic Medium", Meiryo, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.65; }
  h1 { font-size: 18px; color: var(--primary-dark); }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  label { display: block; margin-top: 10px; font-size: 13.5px; color: #444; font-weight: 500; }
  input[type=text] { width: 100%; padding: 11px 10px; font-size: 16px; margin-top: 3px; border: 1px solid #bcc7d6; border-radius: 6px; background: #fbfcfe; }
  button { width: 100%; padding: 13px 16px; font-size: 15.5px; margin-top: 14px; cursor: pointer; border: none; border-radius: 6px; background: var(--primary); color: #fff; font-weight: bold; }
  #status { font-size: 14px; min-height: 18px; font-weight: bold; }
  #status.status-ok { color: #2c662d; }
  .help { font-size: 12.5px; color: var(--text-muted); }
  a.back { font-size: 13px; color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
<a class="back" href="./index.html">&larr; 受付画面に戻る</a>
<h1>設定 — 店舗情報</h1>
<p id="status"></p>

<div class="box">
  <h3>委任状の受任者情報(店舗情報)</h3>
  <p class="help">名義変更等で委任状を作成する際、代理人(受任者)として自動的に差し込まれます。この情報はこの端末の中だけに保存され、どこにも送信されません。</p>
  <label for="agent_name">受任者氏名・店舗名</label>
  <input type="text" id="agent_name" placeholder="例: 有限会社サンプル自動車" />
  <label for="agent_address">受任者住所</label>
  <input type="text" id="agent_address" placeholder="例: 東京都杉並区高円寺1-1-1" />
  <button onclick="saveSettings()">設定を保存する</button>
</div>

<script>
function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.innerText = msg || '';
  el.className = kind === 'ok' ? 'status-ok' : '';
}
function loadSettings() {
  try {
    const data = JSON.parse(localStorage.getItem('shopSettings') || '{}');
    document.getElementById('agent_name').value = data.agent_name || '';
    document.getElementById('agent_address').value = data.agent_address || '';
  } catch (e) {
    setStatus('設定の読み込みに失敗しました: ' + e.message);
  }
}
function saveSettings() {
  const data = {
    agent_name: document.getElementById('agent_name').value.trim(),
    agent_address: document.getElementById('agent_address').value.trim(),
  };
  localStorage.setItem('shopSettings', JSON.stringify(data));
  setStatus('設定を保存しました。', 'ok');
}
loadSettings();
</script>
</body>
</html>
